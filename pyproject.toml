[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "uwave-accessory"
version = "0.0.1"
description = "Mitutoyo U-WAVE-R measurement module for Open ERP"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
module = [
    "pyserial>=3.5",
    "open-erp-module @ git+https://github.com/tjd10684-bit/Open-ERP-Module-SDK@v1.2.0#subdirectory=python",
]
test = [
    "pytest>=8", "pyserial>=3.5",
    "open-erp-module @ git+https://github.com/tjd10684-bit/Open-ERP-Module-SDK@v1.2.0#subdirectory=python",
]

[project.scripts]
uwave-setup = "uwave_accessory.setup_window:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
